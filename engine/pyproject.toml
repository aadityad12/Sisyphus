[project]
name = "sisyphus-engine"
version = "0.1.0"
description = "SIsyphus engine: the Creator, Reviewer and Auditor agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "openai>=3.46.0",
    "opencv-python-headless>=4.10,<5",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sisyphus_engine"]
